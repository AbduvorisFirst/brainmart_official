server {
    server_name brainmart.uz www.brainmart.uz;

    # Максимальный размер загружаемого файла (чеки оплаты, фото товаров)
    client_max_body_size 25M;

    # Раздача статики (CSS, JS, SVG, шрифты) напрямую через Nginx
    location /static/ {
        alias /var/www/brainmart/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Раздача медиа (фото товаров, скриншоты чеков) напрямую через Nginx
    location /media/ {
        alias /var/www/brainmart/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Проксирование всех запросов в Gunicorn через unix-сокет
    location / {
        proxy_pass http://unix:/run/brainmart.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Логи
    access_log /var/log/nginx/brainmart_access.log;
    error_log /var/log/nginx/brainmart_error.log;
}
