server {
    listen 80;
    listen [::]:80;
    server_name brainmart.uz www.brainmart.uz *.brainmart.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name brainmart.uz www.brainmart.uz *.brainmart.uz;

    ssl_certificate /etc/letsencrypt/live/brainmart.uz-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brainmart.uz-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location = /favicon.ico {
        alias /var/www/brainmart/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location /static/ {
        alias /var/www/brainmart/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/brainmart/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Сжатие Gzip для мгновенной отдачи страниц и CSS/JS
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    access_log /var/log/nginx/brainmart_access.log;
    error_log /var/log/nginx/brainmart_error.log;
}
