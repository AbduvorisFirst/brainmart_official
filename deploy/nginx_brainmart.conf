server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name brainmart.uz www.brainmart.uz;

    client_max_body_size 100M;

    location /static/ {
        alias /var/www/brainmart/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/brainmart/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Сжатие Gzip для мгновенной отдачи страниц и CSS/JS
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    access_log /var/log/nginx/brainmart_access.log;
    error_log /var/log/nginx/brainmart_error.log;
}
